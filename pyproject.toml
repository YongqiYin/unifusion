[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifusion"
version = "0.1.0"
description = "Entropy-adaptive context assembly for heterogeneous retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yongqi Yin" }]
keywords = ["retrieval-augmented-generation", "multi-modality", "context-assembly", "submodular"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
sparse = ["scipy>=1.10", "scikit-learn>=1.2"]
dense = ["torch>=2.0", "transformers>=4.36"]
llm = ["requests>=2.28"]
router = ["torch>=2.0", "transformers>=4.36"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/YongqiYin/unifusion"

[tool.setuptools.packages.find]
include = ["unifusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
